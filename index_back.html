<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Binance Futures Scanner</title>

<style>

body{
    background:#111827;
    color:#eee;
    font-family:Arial;
    margin:20px;
}

h2{
    margin-top:30px;
}

button{
    padding:8px 15px;
    cursor:pointer;
    margin:5px;
}

select{
    padding:6px;
    margin:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #333;
    padding:6px;
    text-align:center;
}

th{
    background:#1f2937;
}

tr:nth-child(even){
    background:#19212e;
}

.favorite{
    color:gold;
    cursor:pointer;
}

.notfavorite{
    color:#666;
    cursor:pointer;
}

.green{
    color:#4ade80;
}

.red{
    color:#f87171;
}

.section{
    margin-bottom:25px;
}

</style>
</head>

<body>

<h1>Binance Futures Scanner</h1>

<div class="section">

<h2>24hr Ticker</h2>

<button onclick="loadTicker()">
Load USDT Futures
</button>

<span id="tickerCount"></span>

<table id="tickerTable"></table>

</div>

<hr>

<div class="section">

<h2>Kline Analyzer</h2>

頻率

<select id="interval">

<option value="5m">5分鐘</option>
<option value="15m" selected>15分鐘</option>
<option value="1h">1小時</option>
<option value="4h">4小時</option>
<option value="12h">12小時</option>
<option value="1d">1天</option>

</select>

<button onclick="analyzeFavorites()">
分析我的最愛
</button>

</div>

<hr>

<div class="section">

模式

<select id="mode">

<option value="body">
BodyAmp
</option>

<option value="whole">
WholeAmp
</option>

<option value="continue">
ContinueUPorDOWN
</option>

</select>

根數

<select id="lookback"></select>

排序

<select id="sortOrder">
<option value="desc">DESC</option>
<option value="asc">ASC</option>
</select>

</div>

<table id="analysisTable"></table>

<script>

let tickerCache =
JSON.parse(
localStorage.getItem("tickerCache") || "[]"
);

let favorites =
JSON.parse(
localStorage.getItem("favorites") || "[]"
);

for(let i=1;i<=50;i++){

document
.getElementById("lookback")
.innerHTML +=
`<option ${i===5?"selected":""}>
${i}
</option>`;

}

renderTicker();

async function loadTicker(){

try{

const res =
await fetch(
"https://fapi.binance.com/fapi/v1/ticker/24hr"
);

let data =
await res.json();

data =
data
.filter(
x=>x.symbol.endsWith("USDT")
)
.sort(
(a,b)=>
parseFloat(b.priceChangePercent)
-
parseFloat(a.priceChangePercent)
);

tickerCache=data;

localStorage.setItem(
"tickerCache",
JSON.stringify(data)
);

renderTicker();

}
catch(ex){

alert(ex);

}

}

function renderTicker(){

const table=
document.getElementById("tickerTable");

if(tickerCache.length===0){

table.innerHTML="";

return;

}

document.getElementById(
"tickerCount"
).innerText=
`${tickerCache.length} Symbols`;

let html=
`
<tr>
<th>Fav</th>
<th>Symbol</th>
<th>24hr %</th>
<th>Volume</th>
</tr>
`;

tickerCache.forEach(x=>{

const fav=
favorites.includes(
x.symbol
);

html+=`
<tr>

<td>

<span
class="${
fav
?
'favorite'
:
'notfavorite'
}"
onclick="toggleFavorite('${x.symbol}')">

${fav?'★':'☆'}

</span>

</td>

<td>
${x.symbol}
</td>

<td class="${
parseFloat(
x.priceChangePercent
)>=0
?
'green'
:
'red'
}">
${parseFloat(
x.priceChangePercent
).toFixed(2)}%
</td>

<td>
${Number(
x.quoteVolume
).toLocaleString()}
</td>

</tr>
`;

});

table.innerHTML=html;

}

function toggleFavorite(symbol){

if(
favorites.includes(symbol)
){

favorites=
favorites.filter(
x=>x!==symbol
);

}
else{

favorites.push(symbol);

}

localStorage.setItem(
"favorites",
JSON.stringify(
favorites
)
);

renderTicker();

}

async function analyzeFavorites(){

if(
favorites.length===0
){

alert(
"沒有 Favorite"
);

return;

}

const interval=
document.getElementById(
"interval"
).value;

const list=[];

for(
const symbol
of favorites
){

try{

const url=
`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=50`;

const res=
await fetch(url);

const data=
await res.json();

list.push({

symbol,

candles:
data.map(
convertKline
)

});

}
catch(ex){

console.log(
symbol,
ex
);

}

}

renderAnalysis(
list
);

}

function convertKline(k){

const open=
parseFloat(k[1]);

const high=
parseFloat(k[2]);

const low=
parseFloat(k[3]);

const close=
parseFloat(k[4]);

return{

bodyAmp:
((close-open)
/open)
*100,

wholeAmp:
((high-low)
/low)
*100,

bull:
close>=open

};

}

function renderAnalysis(list){

const mode=
document.getElementById(
"mode"
).value;

const count=
parseInt(
document.getElementById(
"lookback"
).value
);

const order=
document.getElementById(
"sortOrder"
).value;

let results=[];

for(
const item
of list
){

const arr=
item.candles
.slice(-count);

if(
mode==="body"
){

const avg=
arr.reduce(
(a,b)=>
a+b.bodyAmp,
0
)
/arr.length;

results.push({

symbol:
item.symbol,

value:avg

});

}

else if(
mode==="whole"
){

const avg=
arr.reduce(
(a,b)=>
a+b.wholeAmp,
0
)
/arr.length;

results.push({

symbol:
item.symbol,

value:avg

});

}

else{

const firstBull=
arr[0].bull;

const same=

arr.every(
x=>
x.bull===firstBull
);

let growing=true;

for(
let i=1;
i<arr.length;
i++
){

if(
Math.abs(
arr[i].bodyAmp
)
<
Math.abs(
arr[i-1].bodyAmp
)
){

growing=false;

break;

}

}

results.push({

symbol:
item.symbol,

direction:
same
?
(
firstBull
?
"UP"
:
"DOWN"
)
:
"MIX",

growing,

value:
arr.length

});

}

}

results.sort(
(a,b)=>
order==="desc"
?
b.value-a.value
:
a.value-b.value
);

let html="";

if(
mode==="continue"
){

html=`
<tr>
<th>Symbol</th>
<th>Direction</th>
<th>AbsGrowing</th>
</tr>
`;

results.forEach(
x=>{

html+=`
<tr>

<td>
${x.symbol}
</td>

<td>
${x.direction}
</td>

<td>
${x.growing ? 'YES':'NO'}
</td>

</tr>
`;

});

}
else{

html=`
<tr>
<th>Symbol</th>
<th>Value</th>
</tr>
`;

results.forEach(
x=>{

html+=`
<tr>

<td>
${x.symbol}
</td>

<td>
${x.value.toFixed(
4
)}%
</td>

</tr>
`;

});

}

document
.getElementById(
"analysisTable"
)
.innerHTML=
html;

}

</script>

</body>
</html>
