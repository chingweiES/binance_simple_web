services:
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    # 不對外開 port，只讓 nginx 在內部網路存取
    expose:
      - "8000"
    # 密碼雜湊與 session 金鑰（auth.json）存在這裡，重建容器不會遺失
    volumes:
      - appdata:/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  appdata:
